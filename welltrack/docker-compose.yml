services:
  postgres:
    image: postgres:16-alpine
    container_name: welltrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: welltrack
      POSTGRES_PASSWORD: welltrack_dev_password
      POSTGRES_DB: welltrack
    ports:
      - "5432:5432"
    volumes:
      - welltrack_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U welltrack -d welltrack"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  welltrack_postgres_data:
